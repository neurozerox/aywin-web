<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#141A28"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="100%" y2="100%" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="100%" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Subtle tech grid -->
  <g stroke="#1E293B" stroke-width="1" opacity="0.6">
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="500" y1="0" x2="500" y2="630"/>
    <line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="250" x2="1200" y2="250"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="550" x2="1200" y2="550"/>
  </g>

  <!-- Ambient Glow -->
  <circle cx="240" cy="280" r="320" fill="url(#glow)"/>

  <!-- Logo Mark -->
  <g transform="translate(100, 110)">
    <rect width="100" height="100" rx="24" fill="#1B2335" stroke="#334155" stroke-width="2.5"/>
    <path d="M30 72L50 28L70 72" stroke="url(#cyanGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M38 56H62" stroke="url(#cyanGrad)" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="50" cy="46" r="5" fill="#38BDF8"/>
  </g>

  <!-- Brand Title -->
  <text x="225" y="158" font-family="'Space Grotesk', system-ui, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" letter-spacing="3">AYWIN</text>
  <text x="360" y="158" font-family="'Space Grotesk', system-ui, sans-serif" font-size="34" font-weight="500" fill="#38BDF8" letter-spacing="3">SOFTWARE</text>
  <text x="225" y="195" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="600" fill="#94A3B8" letter-spacing="1">CONCEPCIÓN, CHILE • ESTUDIO DE INGENIERÍA &amp; PRODUCTOS</text>

  <!-- Main Headline -->
  <text x="100" y="300" font-family="'Space Grotesk', system-ui, sans-serif" font-size="52" font-weight="700" fill="#FFFFFF">Ingeniería de software robusta,</text>
  <text x="100" y="365" font-family="'Space Grotesk', system-ui, sans-serif" font-size="52" font-weight="700" fill="url(#textGrad)">potenciada por Inteligencia Artificial.</text>

  <!-- Subtitle -->
  <text x="100" y="425" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="400" fill="#CBD5E1">17+ años de trayectoria • QA Lead • Desarrollo Móvil • Agentes de IA</text>

  <!-- Capability Pills -->
  <g transform="translate(100, 485)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="190" height="46" rx="23" fill="#1E293B" stroke="#475B85" stroke-width="1.5"/>
    <text x="95" y="29" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="600" fill="#38BDF8" text-anchor="middle">AITA-QA &amp; Testing</text>

    <!-- Pill 2 -->
    <rect x="210" y="0" width="180" height="46" rx="23" fill="#1E293B" stroke="#475B85" stroke-width="1.5"/>
    <text x="300" y="29" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="600" fill="#A78BFA" text-anchor="middle">Agentes de IA</text>

    <!-- Pill 3 -->
    <rect x="410" y="0" width="200" height="46" rx="23" fill="#1E293B" stroke="#475B85" stroke-width="1.5"/>
    <text x="510" y="29" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="600" fill="#34D399" text-anchor="middle">Apps Flutter (iOS/Android)</text>

    <!-- Pill 4 -->
    <rect x="630" y="0" width="190" height="46" rx="23" fill="#1E293B" stroke="#475B85" stroke-width="1.5"/>
    <text x="725" y="29" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="600" fill="#F8FAFC" text-anchor="middle">Concepción, Chile</text>
  </g>

  <!-- Domain watermark bottom right -->
  <text x="1100" y="585" font-family="'Space Grotesk', system-ui, sans-serif" font-size="20" font-weight="700" fill="#94A3B8" text-anchor="end" letter-spacing="1">aywin.cl</text>
</svg>
